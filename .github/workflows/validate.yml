name: Validate collection and website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Validate records and preservation
        run: |
          node scripts/generate.mjs
          git diff --exit-code -- README.md docs/CATALOG.md docs/BENCHMARKS.md
          node scripts/check.mjs
      - name: Install without dependency lifecycle scripts
        working-directory: website
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: website
        run: pnpm exec tsc --noEmit
      - name: Build static website
        working-directory: website
        run: pnpm build
      - name: Stage and validate public assets
        run: node scripts/package-static.mjs
