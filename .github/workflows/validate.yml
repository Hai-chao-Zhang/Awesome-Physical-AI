name: Validate and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /Awesome-Physical-AI
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Validate records and preservation
        run: |
          node scripts/generate.mjs
          git diff --exit-code -- README.md docs/CATALOG.md docs/BENCHMARKS.md docs/RESOURCE-LINKS.md
          node scripts/check.mjs
      - name: Install without dependency lifecycle scripts
        working-directory: website
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: website
        run: pnpm exec tsc --noEmit
      - name: Build static website
        working-directory: website
        run: pnpm build
      - name: Stage and validate public assets
        run: node scripts/package-static.mjs
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
